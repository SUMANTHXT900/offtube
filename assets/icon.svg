<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Offtube app mark: download arrow in a dark tile, emerald accent matching the UI -->
  <rect x="48" y="48" width="928" height="928" rx="232" fill="#09090b"/>
  <rect x="60" y="60" width="904" height="904" rx="220" fill="none" stroke="#27272a" stroke-width="24"/>
  <!-- arrow shaft -->
  <rect x="462" y="250" width="100" height="330" rx="50" fill="#34d399"/>
  <!-- arrow head (stroked chevron, round joins) -->
  <path d="M340 545 L512 730 L684 545" fill="none" stroke="#34d399" stroke-width="100" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- tray baseline -->
  <rect x="330" y="800" width="364" height="52" rx="26" fill="#34d399" opacity="0.45"/>
</svg>
